# Kitty, dressed like the Gallery desktop and Xfce Terminal.
# Colours: gallery-navy.conf and gallery-light.conf. gallery-mode points
# room.conf at the current room and sends open windows SIGUSR1 to reload.

font_family      DM Mono
bold_font        DM Mono Medium
italic_font      DM Mono Italic
bold_italic_font DM Mono Italic
font_size        21.0
modify_font      cell_height 115%

# Generous margins, like a page. Kitty ignores the desktop's 2x scaling on
# the 4K screen, so sizes here are doubled.
window_padding_width 24 32
placement_strategy   center

cursor_shape     block
cursor_blink_interval 0
mouse_hide_wait  0
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 1

tab_bar_edge      top
tab_bar_style     separator
tab_separator     "  "
tab_title_template " {title} "
tab_bar_margin_height 6 0
active_tab_font_style   normal
inactive_tab_font_style normal

# Panes: ctrl+shift+enter opens one, ctrl+shift+] and [ move between them.
enabled_layouts splits, stack
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.75

include gallery-navy.conf
include room.conf
