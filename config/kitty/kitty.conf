# Kitty, dressed like the Bierstadt desktop and Xfce Terminal.
# Colours: bierstadt-dark.conf and bierstadt-light.conf. bierstadt-mode points
# room.conf at the current room and sends open windows SIGUSR1 to reload.

font_family      DM Mono
bold_font        DM Mono Medium
italic_font      DM Mono Italic
bold_italic_font DM Mono Italic
font_size        21.0
modify_font      cell_height 115%

# Generous margins, like a page. Kitty ignores the desktop's 2x scaling on
# the 4K screen, so sizes here are doubled.
window_padding_width 24 32
placement_strategy   center
remember_window_size no
initial_window_width  1800
initial_window_height 1500

cursor_shape     block
cursor_blink_interval 0
mouse_hide_wait  0
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 1

tab_bar_edge      top
tab_bar_style     separator
tab_separator     "  "
tab_title_template " {title} "
tab_bar_margin_height 6 0
active_tab_font_style   normal
inactive_tab_font_style normal

# Panes: ctrl+shift+enter opens one, ctrl+shift+] and [ move between them.
enabled_layouts splits, stack
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.75

# Tabs: ctrl+shift+t opens one, alt+1 to alt+9 jump straight to it.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

include bierstadt-dark.conf
include room.conf
